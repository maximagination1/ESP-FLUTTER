; PlatformIO Project Configuration File
;
; Select the matching environment for the board you are flashing. The
; ESP_FLUTTER_PLATFORMIO_BOARD_PROFILE gives src/config.h an automatic default.
; A manual ESP_FLUTTER_SELECTED_BOARD value in src/config.h overrides it.
;
; Tested/default:
;   seeed_xiao_esp32c3
;
; Experimental, not flight-tested yet. Use at your discretion:
;   seeed_xiao_esp32s3
;   esp32dev

[platformio]
; Default build target. This prevents `pio run` from compiling every supported
; board each time. To flash another board, change this line and also select the
; matching ESP_FLUTTER_SELECTED_BOARD option in src/config.h.
default_envs = seeed_xiao_esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
	https://github.com/Links2004/arduinoWebSockets.git

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
	-D ESP_FLUTTER_PLATFORMIO_BOARD_PROFILE=1

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
	-D ESP_FLUTTER_PLATFORMIO_BOARD_PROFILE=2

[env:esp32dev]
board = esp32dev
build_flags =
	-D ESP_FLUTTER_PLATFORMIO_BOARD_PROFILE=3
